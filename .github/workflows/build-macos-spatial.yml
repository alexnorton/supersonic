name: Build macOS Spatial Audio

on:
  push:
    branches: ["feature/macos-spatial-audio"]

jobs:
  build-macos-arm64:
    name: Build macOS arm64
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: stable
      - name: Install dependencies
        run: brew install --force mpv dylibbundler
      - name: Install Fyne tool
        run: go install fyne.io/fyne/v2/cmd/fyne@latest
      - name: Package app bundle
        run: |
          export C_INCLUDE_PATH="/opt/homebrew/include:${C_INCLUDE_PATH:-}"
          export LIBRARY_PATH="/opt/homebrew/lib:${LIBRARY_PATH:-}"
          make package_macos
          make bundledeps_macos_homebrew
          make zip_macos
          mv Supersonic.zip Supersonic_mac_arm64_spatial_audio.zip
      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: Supersonic_mac_arm64_spatial_audio
          path: Supersonic_mac_arm64_spatial_audio.zip
